{% load static %}
<link href="{% static 'css/kye.css' %}" rel="stylesheet">
<style type="text/css">
    #bg {
        background: url('img/white 1.jpg') 100% no-repeat center;
    }
</style>
<link rel="stylesheet" type="text/css" href="{% static 'vendor/bootstrap/four/css/bootstrap.min.css' %}">
<link rel="stylesheet" type="text/css" href="{% static 'vendor/bootstrap/three/css/bootstrap.min.css' %}">

{% include 'nav.html' %}

<body id="bg">
<div class="container-fluid">
    <div class="row" style="padding-top: 300px">
        <div class="col-sm-4"></div>

        <div class="col-sm-4">
            <div class="col-sm-2"></div>
            <div class="col-sm-10">
                <div class="filter"></div>
                <div class="container bg-dark">
                    <center><h2 style="color: white">Metz Numeric School</h2></center>
                    <br>
                    <form action="{% url 'login' %}" method="POST">
                        {% csrf_token %}
                        <label>Nom d'utilisateur</label><br>
                        <input type="text" name="username" required="Fill Username" style="background-color: white"><br>
                        <label>Mot de passe</label><br>
                        <input type="password" name="password" required="Fill Password" style="background-color: white"><br>
                        <button>Se connecter</button>
                    </form>
                    <div class="card-footer">
                        <div class="d-flex justify-content-center">
                            <div class="messages">
                                {% for message in messages %}
                                    <a class="alert alert-success" style="color:red;"> {{ message }}</a>
                                {% endfor %}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-4"></div>

        </div>
    </div>
</div>

</body>

</html>
